services:
    postgres:
        image: postgres:16-alpine
        container_name: tasks-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: tasks
        ports:
            - "5432:5432"
        volumes:
            - tasks_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: .
        container_name: tasks-backend
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tasks?schema=public
            JWT_ACCESS_SECRET: access
            JWT_REFRESH_SECRET: refresh
            PORT: 3001
        ports:
            - "3001:3001"

volumes:
    tasks_postgres_data: